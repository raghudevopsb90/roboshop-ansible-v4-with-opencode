---
- name: Load pre-reqs tasks
  ansible.builtin.import_tasks: pre-reqs.yml

- name: Install Python 3
  ansible.builtin.dnf:
    name:
      - python3
      - python3-pip
    state: present

- name: Verify Python version
  ansible.builtin.shell: python3 --version
  register: python_version
  changed_when: false

- name: Install Python dependencies
  ansible.builtin.shell: |
    cd /app
    pip3 install -r requirements.txt
  args:
    chdir: /app
  become_user: appuser

- name: Install extra pip packages
  ansible.builtin.shell: pip3 install {{ extra_pip_packages | default([]) | join(' ') }}
  args:
    chdir: /app
  become_user: appuser
  when: extra_pip_packages is defined and extra_pip_packages | length > 0

- name: Load MySQL schema if defined
  ansible.builtin.import_tasks: mysql-schema.yml
  when: schema_files is defined

- name: Set ownership and permissions
  ansible.builtin.file:
    path: /app
    owner: appuser
    group: appuser
    recurse: yes
    mode: 'o-rwx'

- name: Copy systemd unit and start service
  ansible.builtin.import_tasks: systemd.yml
