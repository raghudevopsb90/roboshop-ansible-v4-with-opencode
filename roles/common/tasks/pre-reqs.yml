---
- name: Create appuser
  ansible.builtin.user:
    name: appuser
    shell: /bin/false
    create_home: no
    home: /app

- name: Remove and recreate /app directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: Create /app directory
  ansible.builtin.file:
    path: /app
    state: directory
    mode: '0755'
    owner: appuser
    group: appuser

- name: Download application artifact
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/raghudevopsb90/roboshop-microservices/main/artifacts/{{ component_name }}.zip"
    dest: /tmp/{{ component_name }}.zip
    mode: '0644'

- name: Extract application to /app
  ansible.builtin.unarchive:
    src: /tmp/{{ component_name }}.zip
    dest: /app
    remote_src: yes
    owner: appuser
    group: appuser
