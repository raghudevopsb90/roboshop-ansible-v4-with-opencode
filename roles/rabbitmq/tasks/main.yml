---
- name: Create RabbitMQ erlang repository
  ansible.builtin.copy:
    content: |
      [rabbitmq_erlang]
      name=rabbitmq_erlang
      baseurl=https://packagecloud.io/rabbitmq/erlang/el/9/$basearch
      gpgcheck=0
      enabled=1
    dest: /etc/yum.repos.d/rabbitmq_erlang.repo
    mode: '0644'

- name: Install Erlang
  ansible.builtin.dnf:
    name: erlang
    state: present

- name: Create RabbitMQ repository
  ansible.builtin.copy:
    content: |
      [rabbitmq_rabbitmq-server]
      name=rabbitmq_rabbitmq-server
      baseurl=https://packagecloud.io/rabbitmq/rabbitmq-server/el/9/$basearch
      gpgcheck=0
      enabled=1
    dest: /etc/yum.repos.d/rabbitmq_rabbitmq-server.repo
    mode: '0644'

- name: Install RabbitMQ server
  ansible.builtin.dnf:
    name: rabbitmq-server
    state: present

- name: Enable and start RabbitMQ
  ansible.builtin.systemd:
    name: rabbitmq-server
    enabled: yes
    state: started

- name: Enable RabbitMQ management plugin
  ansible.builtin.command: rabbitmq-plugins enable rabbitmq_management
  changed_when: true

- name: Restart RabbitMQ after plugin enable
  ansible.builtin.systemd:
    name: rabbitmq-server
    state: restarted

- name: Create RabbitMQ user
  ansible.builtin.shell: |
    rabbitmqctl add_user roboshop RoboShop@1
    rabbitmqctl set_user_tags roboshop administrator
    rabbitmqctl set_permissions -p / roboshop ".*" ".*" ".*"

