---
- name: Install Nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Install Node.js 20
  ansible.builtin.shell: |
    curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
    dnf install -y nodejs
  changed_when: true

- name: Remove and create /tmp/frontend directory
  ansible.builtin.file:
    path: /tmp/frontend
    state: absent

- name: Create /tmp/frontend directory
  ansible.builtin.file:
    path: /tmp/frontend
    state: directory
    mode: '0755'

- name: Download frontend artifact
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/raghudevopsb90/roboshop-microservices/main/artifacts/frontend.zip"
    dest: /tmp/frontend.zip
    mode: '0644'

- name: Extract frontend to /tmp/frontend
  ansible.builtin.unarchive:
    src: /tmp/frontend.zip
    dest: /tmp/frontend
    remote_src: yes

- name: Install npm dependencies
  ansible.builtin.command: npm install
  args:
    chdir: /tmp/frontend

- name: Build frontend
  ansible.builtin.command: npm run build
  args:
    chdir: /tmp/frontend

- name: Copy frontend to nginx html directory
  ansible.builtin.shell: |
    rm -rf /usr/share/nginx/html/*
    cp -r /tmp/frontend/out/* /usr/share/nginx/html/
  changed_when: true

- name: Configure nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: '0644'

- name: Test nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: yes
    state: restarted
